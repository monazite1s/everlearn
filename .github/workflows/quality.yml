# 定义提交与合并请求共用的质量门禁。
name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    name: Static and unit quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 版本 6.0.2
      - uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # 版本 2.0.1
        with:
          cache: true
          install: false
          runtime: node@24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  dependencies:
    name: Docker dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: ci-${{ github.run_id }}
      REDIS_PASSWORD: ci-${{ github.run_id }}
      S3_ACCESS_KEY: ci-${{ github.run_id }}
      S3_SECRET_KEY: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 版本 6.0.2
      - run: docker compose up --detach --wait
      - run: docker compose ps
      - if: failure()
        run: docker compose logs
