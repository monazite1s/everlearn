name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    name: Static and unit quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          cache: true
          install: false
          runtime: node@24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  dependencies:
    name: Docker dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: ci-${{ github.run_id }}
      REDIS_PASSWORD: ci-${{ github.run_id }}
      S3_ACCESS_KEY: ci-${{ github.run_id }}
      S3_SECRET_KEY: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: docker compose up --detach --wait
      - run: docker compose ps
      - if: failure()
        run: docker compose logs

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          cache: true
          install: false
          runtime: node@24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload failed traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          name: playwright-traces
          path: test-results/**/trace.zip
          retention-days: 7
